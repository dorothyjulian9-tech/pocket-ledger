const RECOVERY_KEY='pocket-ledger-v2-recovery',VIEW_KEY='pocket-ledger-v2-view';

async function save(next){if(writeBusy)throw Error('上一笔保存尚未完成，请稍候');writeBusy=true;try{const revision=state.revision||null;next.savedAt=Date.now();next.revision=next.savedAt+'-'+Math.random().toString(36).slice(2);if(db){const prior=await readStored();if(prior&&(prior.revision||null)!==revision)throw Error('账本已在其他页面更新。请刷新读取最新数据后再操作');await writeStored(next);let check=await readStored();if(!check||check.revision!==next.revision||check.batches.length!==next.batches.length||check.transactions.length!==next.transactions.length)throw Error('保存回读校验失败，请保留原账单并重试')}
  let mirrored=false;try{localStorage.setItem(RECOVERY_KEY,JSON.stringify(next));let check=getLocal(RECOVERY_KEY);mirrored=check?.revision===next.revision}catch(e){}if(!db&&!mirrored)throw Error('当前浏览器无法持久保存，导入未完成。请在普通浏览模式打开');state=next;storageStatus=db?(mirrored?'数据库已回读校验 · 本机备用副本已保存':'数据库已回读校验 · 备用空间不足，请导出完整备份'):'已保存并校验本机备用副本';rememberView();
}finally{writeBusy=false}}
function storageSummary(){return '<div class="panel hint" style="padding:12px 16px"><b>本机已保存 '+state.batches.length+' 份原始账单 · '+state.transactions.length+' 笔交易</b><br>'+esc(storageStatus)+(state.savedAt?' · '+new Date(state.savedAt).toLocaleString('zh-CN'):'')+'<br>当前查看：'+esc(mode==='year'?period.slice(0,4)+' 年':period)+' · '+(account==='all'?'全部账号':esc(accountName(account)))+'</div>'}
window.addEventListener('beforeunload',e=>{if(writeBusy||pending.length){e.preventDefault();e.returnValue='文件尚未确认保存'}});

function filtered(){return state.transactions.filter(t=>(mode==='year'?t.month.slice(0,4)===period.slice(0,4):t.month===period)&&(account==='all'||t.account===account))}
function accountName(id){return state.accounts.find(a=>a.id===id)?.name||id}
function options(items,value){return items.map(([id,name])=>`<option value="${esc(id)}" ${id===value?'selected':''}>${esc(name)}</option>`).join('')}
function toolbar(){let years=[...new Set([new Date().getFullYear()+'',...state.transactions.map(t=>t.month.slice(0,4))])].sort().reverse();return `<div class="toolbar"><select aria-label="统计范围" onchange="mode=this.value;render()">${options([['month','按月分析'],['year','按年分析']],mode)}</select>${mode==='month'?`<input aria-label="月份" type="month" value="${period}" onchange="period=this.value||period;page=0;render()">`:`<select aria-label="年份" onchange="period=this.value+'-01';page=0;render()">${options(years.map(y=>[y,y+' 年']),period.slice(0,4))}</select>`}<select aria-label="账号筛选" onchange="account=this.value;page=0;render()">${options([['all','全部四个账号'],...state.accounts.map(a=>[a.id,a.name])],account)}</select><button class="btn secondary" onclick="render();notify('分析已更新，按所选时间与账号汇总')">一键分析</button></div>`}
function bars(rows){let map={};rows.filter(t=>t.kind==='expense').forEach(t=>map[t.category]=(map[t.category]||0)+t.cents);let list=Object.entries(map).sort((a,b)=>b[1]-a[1]),sum=list.reduce((n,x)=>n+x[1],0);return list.length?list.slice(0,12).map(([c,n])=>`<div class="barrow"><div class="row"><span>${esc(c)}</span><b>${money(n)} <small>${(n/sum*100).toFixed(1)}%</small></b></div><div class="bar"><i style="width:${n/sum*100}%"></i></div></div>`).join(''):'<div class="empty">暂无已确认支出</div>'}
function overview(){let rows=filtered(),t=E.totals(rows),label=mode==='year'?period.slice(0,4)+' 年':period;let imports=state.batches.filter(b=>b.months.some(m=>mode==='year'?m.startsWith(period.slice(0,4)):m===period));let coverage=state.accounts.map(a=>{let n=imports.filter(b=>b.account===a.id).length;return `<div class="slot"><b>${esc(a.name)}</b><small>${n?'已导入 '+n+' 份':'本期尚未导入'}</small></div>`}).join('');return toolbar()+`<section class="panel hero"><div class="row"><div><div class="muted">${esc(label)} · ${account==='all'?'四账号合并':esc(accountName(account))} · 净支出</div><div class="big">${money(t.netExpense)}</div><div class="muted mini">已确认支出 − 已确认退款；统计属于本期的交易。</div></div><button class="btn green" onclick="go('import')">＋ 导入本月账单</button></div></section><div class="stats"><div class="stat"><label>收入</label><b class="in">${money(t.income)}</b><small>包含已完成转入；退款另列</small></div><div class="stat"><label>支出</label><b class="out">${money(t.expense)}</b><small>扣除退款前的已确认支出</small></div><div class="stat"><label>退款抵扣</label><b>${money(t.refund)}</b><small>按退款发生月份抵扣</small></div><div class="stat"><label>本期结余</label><b class="${t.balance>=0?'in':'out'}">${money(t.balance)}</b><small>收入 − 净支出，不代表资产余额</small></div></div>${t.reviewCount?`<div class="notice"><b>${t.reviewCount} 笔待核对，涉及 ${money(t.review)}</b>，尚未计入上述收支。退款及方向不明的交易请先确认，当前统计不是最终总额。 <button class="link" onclick="recordKind='review';go('records')">立即核对 →</button></div>`:''}<section class="panel"><div class="row"><h3>本期账单覆盖</h3><small>导入批次不等于整月完整，请每月核对四个账号</small></div><div class="slots">${coverage}</div></section>${!state.transactions.length?`<section class="panel empty"><b>从四份月账单开始</b>导入微信、支付宝个人对账文件，即可查看清晰的收支汇总。<p><button class="btn" onclick="go('import')">开始导入</button></p></section>`:''}<div class="cols"><section class="panel"><h3>钱花在哪里 · 支出分类</h3><p class="hint">按扣退款前支出排名；微信分类为关键词建议，可在明细修改。</p>${bars(rows)}</section><section class="panel"><h3>四个账号的收支</h3><div class="scroll"><table><thead><tr><th>账号</th><th>收入</th><th>净支出</th><th>待核对</th></tr></thead><tbody>${state.accounts.filter(a=>account==='all'||a.id===account).map(a=>{let v=E.totals(rows.filter(t=>t.account===a.id));return `<tr><td>${esc(a.name)}</td><td class="in">${money(v.income)}</td><td class="out">${money(v.netExpense)}</td><td>${v.reviewCount} 笔</td></tr>`}).join('')}</tbody></table></div></section></div><section class="panel"><h3>${period.slice(0,4)} 年 · 每月收支趋势</h3><div class="scroll"><table><thead><tr><th>月份</th><th>收入</th><th>支出</th><th>退款</th><th>净支出</th><th>结余</th><th>待核对</th></tr></thead><tbody>${Array.from({length:12},(_,i)=>{let m=period.slice(0,4)+'-'+String(i+1).padStart(2,'0'),v=E.totals(state.transactions.filter(t=>t.month===m&&(account==='all'||t.account===account)));return `<tr><td><button class="link" onclick="period='${m}';mode='month';render()">${m}</button></td><td class="in">${money(v.income)}</td><td>${money(v.expense)}</td><td>${money(v.refund)}</td><td class="out">${money(v.netExpense)}</td><td>${money(v.balance)}</td><td>${v.reviewCount||'—'}</td></tr>`}).join('')}</tbody></table></div><p class="hint">未导入的月份显示 0，不代表没有消费。往年月账单持续保留，可切换年份汇总。</p></section>`}
function importView(){return `<section class="panel"><h2>导入账单，一键看清收支</h2><p class="muted">每个文件先指定来源账号。支持微信 CSV / XLSX、支付宝 CSV / XLSX；文件全部在本机解析。</p><div class="slots">${state.accounts.map(a=>`<div class="slot"><b>${esc(a.name)}</b><small>${a.platform==='wx'?'微信支付':'支付宝'}</small><button class="link" onclick="renameAccount('${a.id}')">修改名称</button></div>`).join('')}</div><div class="toolbar"><label>来源账号 <select id="sourceAccount" onchange="importAccount=this.value;pending=[];$('preview').innerHTML=''">${options(state.accounts.map(a=>[a.id,a.name]),importAccount)}</select></label><label>账单月份 <input type="month" value="${importMonth}" onchange="importMonth=this.value||importMonth"></label></div><label class="file"><b>选择已解压的账单文件</b><br><span class="hint">同一账号可一次选择多份；不同账号请分开导入</span><br><input type="file" accept=".csv,.xlsx,.txt" multiple onchange="previewFiles(this.files);this.value=''" ${busy?'disabled':''}></label><div id="preview"></div></section><section class="panel"><h3>统计口径</h3><p>① 成功的明确收入 / 支出自动归类。② 未完成交易和原账单“不计收支”单列排除。③ 转入计入收入、转出计入支出；自己账号互转可手动选择不计收支。充值、理财、退款和方向不明的记录进入待核对。</p><p class="hint">退款核对：原支出与单独退款记录都存在时，原记录选“支出”，单独退款选“退款抵扣”；若只有一条已全额退款的原交易，可选“不计收支”。部分退款需结合实际退款记录核对。每笔保留原始字段。</p><p class="hint">文件跨月时按每笔交易日期自动分月；“账单月份”用于无交易文件的归档。无交易单号时只能按行内容去重，请人工核查。同一人多个账号互转会同时出现转入与转出，如需排除，请在明细中确认并修改。</p></section><details class="panel"><summary>导出文件与备份说明</summary><p>请在微信、支付宝账单中导出“个人对账 / 收支明细”数据文件。收到加密 ZIP 后，先用平台提供的密码解压，再选择内部的 CSV 或 XLSX。PDF 证明文件和旧版 XLS 暂不支持。</p><p>本版不连接微信或支付宝账号。旧手动记账数据的存储不改动，也不会自动混入导入账单。请固定使用 Safari 或主屏幕其中一个入口，并定期在“账单档案”导出完整备份。</p></details>`}
async function renameAccount(id){let a=state.accounts.find(a=>a.id===id),name=prompt('给此账号起一个容易辨认的名称',a.name);if(!name?.trim())return;let next=structuredClone(state);next.accounts.find(a=>a.id===id).name=name.trim().slice(0,40);try{await save(next);render()}catch(e){notify(e.message)}}
function b64(bytes){let s='';for(let i=0;i<bytes.length;i+=16384)s+=String.fromCharCode(...bytes.slice(i,i+16384));return btoa(s)}
async function previewFiles(files){if(busy)return;busy=true;pending=[];$('preview').innerHTML='<p>正在本机解析，请稍候…</p>';const selected=state.accounts.find(a=>a.id===importAccount);let failures=[];try{for(let file of files){try{let {rows,bytes}=await E.readFile(file),parsed=E.normalize(rows,selected.id);let wx=parsed.headers.includes('当前状态'),ali=parsed.headers.includes('交易订单号');if((wx&&selected.platform!=='wx')||(ali&&!wx&&selected.platform!=='ali'))throw Error('文件平台与所选账号不一致，请切换来源账号');let hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(x=>x.toString(16).padStart(2,'0')).join('');let id=selected.id+'-'+hash;if(state.batches.some(b=>b.id===id)||pending.some(b=>b.id===id)){failures.push(file.name+'：同一账号已导入完全相同的文件');continue}pending.push({id,account:selected.id,name:file.name,months:[...new Set(parsed.rows.map(t=>t.month))].sort(),declaredMonth:importMonth,headers:parsed.headers,errors:parsed.errors,parsed:parsed.rows,original:b64(bytes),created:new Date().toISOString()})}catch(e){failures.push(file.name+'：'+e.message)}}if(tab!=='import')return;let all=pending.flatMap(p=>p.parsed),m=E.merge(state.transactions,all),tot=E.totals(all);$('preview').innerHTML=`<div class="notice ${failures.length?'':'good'}"><b>尚未保存：请点击下方“确认导入并分析”</b><br>已解析 ${pending.length} 份文件，${all.length} 笔记录；预计新增 ${m.added}、更新 ${m.updated}、重复跳过 ${m.duplicates}。<br>待核对 ${tot.reviewCount} 笔；无效数据行 ${pending.reduce((n,p)=>n+p.errors.length,0)} 笔。无效行保留在档案中，不计入收支。${failures.length?'<p>'+failures.map(esc).join('<br>')+'</p>':''}</div>${pending.map(p=>`<p><b>${esc(p.name)}</b><br><small>${esc(accountName(p.account))} · ${p.months.join('、')||p.declaredMonth+'（无交易）'} · ${p.parsed.length} 笔</small></p>`).join('')}<p class="hint">请确认账号与交易月份正确；点击确认后保留原始文件及导入历史。</p>${pending.length?'<button class="btn green" onclick="commitImport()">确认导入并分析</button>':''}` }finally{busy=false}}
async function commitImport(){if(busy||!pending.length)return;busy=true;try{let next=structuredClone(state),incoming=[];for(let p of pending){incoming.push(...p.parsed.map(t=>({...t,batch:p.id})));const {parsed,...batch}=p;next.batches.push({...batch,count:parsed.length,months:p.months.length?p.months:[p.declaredMonth]})}let merged=E.merge(next.transactions,incoming);next.transactions=merged.rows;await save(next);let months=pending.flatMap(p=>p.months);if(months.length)period=months.sort().at(-1);pending=[];mode='month';account='all';importMonth=period;rememberView();busy=false;go('overview');notify(`已保存：新增 ${merged.added} 笔，更新 ${merged.updated} 笔，重复跳过 ${merged.duplicates} 笔`)}catch(e){notify('导入未保存：'+e.message)}finally{busy=false}}
function records(){let rows=filtered().filter(t=>(recordKind==='all'||t.kind===recordKind)&&(!search||(t.party+' '+t.product+' '+t.order+' '+t.category).includes(search))).sort((a,b)=>b.date.localeCompare(a.date)),pages=Math.max(1,Math.ceil(rows.length/50));page=Math.min(page,pages-1);return toolbar()+`<section class="panel"><div class="toolbar"><select aria-label="收支类型" onchange="recordKind=this.value;page=0;render()">${options([['all','全部类型'],...Object.entries(names)],recordKind)}</select><input aria-label="搜索交易" placeholder="商户、商品、交易单号" value="${esc(search)}" onchange="search=this.value;page=0;render()"><small>${rows.length} 笔 · 第 ${page+1}/${pages} 页</small></div><p class="hint">点击“核对 / 修改”，调整收支口径或分类。待核对记录暂不计入汇总。</p><div class="scroll"><table><thead><tr><th>时间 / 账号</th><th>对方 / 商品</th><th>金额</th><th>口径 / 分类</th><th>操作</th></tr></thead><tbody>${rows.slice(page*50,page*50+50).map(t=>{let i=state.transactions.indexOf(t);return `<tr><td>${esc(t.date)}<br><small>${esc(accountName(t.account))}</small></td><td>${esc(t.party.slice(0,30))}<br><small>${esc(t.product.slice(0,45))}</small></td><td class="${t.kind==='expense'?'out':t.kind==='income'?'in':''}">${money(t.cents)}</td><td><span class="badge ${t.kind==='review'?'review':''}">${names[t.kind]}</span><br>${esc(t.category)}</td><td><button class="link" onclick="showTransaction(${i})">核对 / 修改</button></td></tr>`}).join('')}</tbody></table></div>${!rows.length?'<div class="empty">没有符合条件的记录</div>':''}<div class="row" style="margin-top:16px"><button class="btn secondary" onclick="page=Math.max(0,page-1);render()">上一页</button><button class="btn secondary" onclick="page=Math.min(${pages-1},page+1);render()">下一页</button><button class="link" onclick="exportRecords()">导出本期明细 CSV</button></div></section>`}
function showTransaction(i){let t=state.transactions[i],b=state.batches.find(b=>b.id===t.batch);$('detailBody').innerHTML=`<h2>核对这笔交易</h2><p><b>${money(t.cents)}</b> · ${esc(t.date)}</p><p>${esc(t.party)} · ${esc(t.product)}</p><p class="notice">${esc(t.reason)}</p><label>统计口径 <select id="editKind">${options(Object.entries(names),t.kind)}</select></label><p><label>分类 <input id="editCategory" value="${esc(t.category)}" style="padding:8px;max-width:100%"></label></p><p class="hint">内部转账选“不计收支”。部分退款请分别核对原支出和退款明细，不要把原消费金额直接当成退款金额。</p><button class="btn" onclick="editTransaction(${i})">保存修改</button><details style="margin:16px 0"><summary>原始账单字段与来源</summary><p class="hint">${esc(accountName(t.account))} · ${esc(b?.name||'')} · 文件第 ${t.line} 行</p><pre>${esc((b?.headers||[]).map((h,j)=>h+'：'+(t.raw[j]||'')).join('\n'))}</pre></details>`;$('detail').showModal()}
async function editTransaction(i){let kind=$('editKind').value,category=$('editCategory').value.trim();if(!Object.hasOwn(names,kind)||!category)return notify('请填写有效口径和分类');let next=structuredClone(state);Object.assign(next.transactions[i],{kind,category:category.slice(0,60),manual:true});try{await save(next);$('detail').close();render();notify('已修改并重新计算')}catch(e){notify(e.message)}}
function archive(){return `<section class="panel"><div class="row"><div><h2>账单档案</h2><p class="muted">${state.batches.length} 份原始账单 · ${state.transactions.length} 笔去重交易 · 历年数据持续保留</p></div><button class="btn green" onclick="backup()">导出完整备份</button></div><p class="notice">本机保存不等于永久备份。清除网站数据、卸载图标或换手机前请导出备份。备份包含交易、人工分类、导入批次和原始文件。</p><label class="btn secondary" style="display:inline-block;cursor:pointer">选择完整备份恢复<input type="file" accept=".json" hidden onchange="restore(this.files[0]);this.value=''"></label><div class="scroll" style="margin-top:20px"><table><thead><tr><th>来源 / 月份</th><th>原文件 / 导入时间</th><th>行数</th><th>操作</th></tr></thead><tbody>${[...state.batches].reverse().map(b=>`<tr><td>${esc(accountName(b.account))}<br><small>${b.months.join('、')}</small></td><td>${esc(b.name)}<br><small>${new Date(b.created).toLocaleString('zh-CN')}</small></td><td>${b.count} 笔<br><small>${b.errors.length} 行异常</small></td><td><button class="link" onclick="downloadOriginal('${b.id}')">下载原账单</button>${b.errors.length?`<br><button class="link" onclick="showErrors('${b.id}')">查看异常行</button>`:''}</td></tr>`).join('')}</tbody></table></div>${!state.batches.length?'<div class="empty">还没有导入账单</div>':''}</section>`}
function showErrors(id){let b=state.batches.find(b=>b.id===id);$('detailBody').innerHTML='<h2>未计入统计的异常行</h2><pre>'+esc(b.errors.map(e=>'第 '+e.line+' 行：'+e.reason+'\n'+e.raw.join(' | ')).join('\n\n'))+'</pre>';$('detail').showModal()}
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function downloadOriginal(id){let b=state.batches.find(b=>b.id===id),bytes=Uint8Array.from(atob(b.original),c=>c.charCodeAt(0));download(new Blob([bytes]),b.name)}
function backup(){download(new Blob([JSON.stringify(state)],{type:'application/json'}),'随付随记-完整备份-'+new Date().toISOString().slice(0,10)+'.json')}
function validBackup(s){if(!s||s.version!==2||!Array.isArray(s.accounts)||s.accounts.length!==4||!Array.isArray(s.transactions)||!Array.isArray(s.batches))throw Error('不是 2.0 完整备份');let ids=new Set(s.accounts.map(a=>a.id));if(ids.size!==4||s.accounts.some(a=>!['wx1','wx2','ali1','ali2'].includes(a.id)||typeof a.name!=='string'))throw Error('账号数据格式不正确');for(let t of s.transactions)if(!ids.has(t.account)||typeof t.key!=='string'||!E.date(t.date)||t.month!==t.date.slice(0,7)||!Number.isSafeInteger(t.cents)||t.cents<0||!Object.hasOwn(names,t.kind)||!Array.isArray(t.raw)||typeof t.category!=='string'||['party','product','status','order','reason'].some(k=>typeof t[k]!=='string'))throw Error('交易数据格式不正确');for(let b of s.batches)if(!ids.has(b.account)||typeof b.id!=='string'||!/^[-\w]+$/.test(b.id)||typeof b.original!=='string'||!Array.isArray(b.headers)||!Array.isArray(b.months)||!b.months.every(m=>/^\d{4}-\d{2}$/.test(m))||!Array.isArray(b.errors))throw Error('档案数据格式不正确');return s}
async function restore(file){if(!file)return;try{if(file.size>150*1024*1024)throw Error('备份文件过大');let s=validBackup(JSON.parse(await file.text()));if(!confirm('恢复将覆盖此入口的现有账本。请先导出当前完整备份。确定恢复？'))return;await save(s);pending=[];restoreView();go('overview');notify('完整备份已恢复')}catch(e){notify('恢复失败：'+e.message)}}
function exportRecords(){let rows=[['交易时间','来源账号','交易对方','商品','金额','统计口径','分类','交易状态','交易单号'],...filtered().map(t=>[t.date,accountName(t.account),t.party,t.product,(t.cents/100).toFixed(2),names[t.kind],t.category,t.status,t.order])];let text='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob([text],{type:'text/csv;charset=utf-8'}),'收支明细-'+(mode==='year'?period.slice(0,4):period)+'.csv')}
function go(t){if(busy&&tab==='import'&&t!=='import')return;tab=t;page=0;render()}
function render(){rememberView();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('app').innerHTML=storageSummary()+({overview,import:importView,records,archive})[tab]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
openDB().then(render).catch(e=>{$('app').innerHTML='<div class="notice"><b>无法打开本机存储，暂时不能导入</b><p>'+esc(e.message)+'</p><p>请使用正常浏览模式并允许网站存储；不要清除已有数据。</p></div>'});

</script></body></html>
